apiVersion: apps/v1
kind: Deployment
metadata:
  name: legallens-frontend
  namespace: legallens
  labels:
    app: legallens-frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legallens-frontend
  template:
    metadata:
      labels:
        app: legallens-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: legallens-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: legallens-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: legallens-frontend
  namespace: legallens
  labels:
    app: legallens-frontend
spec:
  type: NodePort
  selector:
    app: legallens-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
