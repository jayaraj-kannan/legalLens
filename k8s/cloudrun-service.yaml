apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: legallens
  labels:
    cloud.googleapis.com/location: us-south1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/launch-stage: BETA
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: 731620337656-compute@developer.gserviceaccount.com
      containers:
      # 1. Ingress Frontend Container (Nginx + Vue 3 App)
      - name: frontend
        image: us-south1-docker.pkg.dev/legallens-509417/legallens-repo/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_HOST
          value: "127.0.0.1"
        - name: BACKEND_PORT
          value: "8080"
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi

      # 2. Backend API Gateway Container (FastAPI)
      - name: backend
        image: us-south1-docker.pkg.dev/legallens-509417/legallens-repo/backend:latest
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "legallens-509417"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-south1"
        - name: GCS_BUCKET_NAME
          value: "legallens-documents-509417"
        - name: DATABASE_TYPE
          value: "sqlite"
        - name: SQLITE_DB_URL
          value: "sqlite+aiosqlite:////app/data/legallens.db"
        - name: ADK_SERVER_URL
          value: "http://127.0.0.1:8000"
        - name: ADK_APP_NAME
          value: "legallens"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi

      # 3. Google ADK Multi-Agent Server Container
      - name: agent
        image: us-south1-docker.pkg.dev/legallens-509417/legallens-repo/agent:latest
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "legallens-509417"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-south1"
        - name: GOOGLE_GENAI_USE_ENTERPRISE
          value: "1"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
